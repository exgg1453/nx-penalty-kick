name: Android Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.ci/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: Export Android APKs
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy baked-in Godot configuration
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"
          cp -r /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          cp /root/.config/godot/editor_settings-4.3.tres "$HOME/.config/godot/"
          {
            echo "----- editor settings -----"
            cat "$HOME/.config/godot/editor_settings-4.3.tres"
            echo "----- java -----"
            which java keytool jarsigner apksigner zipalign 2>&1 || true
            echo "JAVA_HOME=$JAVA_HOME"
            echo "----- android sdk -----"
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls -la "$ANDROID_HOME" 2>&1 || true
            ls -la "$ANDROID_HOME/build-tools" 2>&1 || true
          } > /tmp/settings_diag.txt

      - name: Create build directory
        run: mkdir -v -p build

      - name: Generate debug keystore
        run: |
          if [ ! -f /root/nx-debug.keystore ]; then
            keytool -genkeypair -v -keystore /root/nx-debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /root/nx-release.keystore

      - name: Inject signing config
        run: |
          sed -i "s#__DEBUG_KEYSTORE_PATH__#/root/nx-debug.keystore#g" export_presets.cfg
          sed -i "s#__DEBUG_KEY_ALIAS__#androiddebugkey#g" export_presets.cfg
          sed -i "s#__DEBUG_KEY_PASSWORD__#android#g" export_presets.cfg
          sed -i "s#__RELEASE_KEYSTORE_PATH__#/root/nx-release.keystore#g" export_presets.cfg
          sed -i "s#__RELEASE_KEY_ALIAS__#${{ secrets.ANDROID_KEY_ALIAS }}#g" export_presets.cfg
          sed -i "s#__RELEASE_KEY_PASSWORD__#${{ secrets.ANDROID_KEY_PASSWORD }}#g" export_presets.cfg

      - name: Export debug APK
        continue-on-error: true
        run: |
          echo "----- settings diag -----" > build/debug-output.log
          cat /tmp/settings_diag.txt >> build/debug-output.log
          echo "----- export_presets.cfg -----" >> build/debug-output.log
          sed 's/password=".*"/password="REDACTED"/' export_presets.cfg >> build/debug-output.log
          echo "----- keystores -----" >> build/debug-output.log
          ls -la /root/*.keystore >> build/debug-output.log 2>&1
          echo "----- godot export -----" >> build/debug-output.log
          godot --headless --verbose --export-debug "Android" build/nx-penalty-kick-debug.apk >> build/debug-output.log 2>&1

      - name: Export release APK
        continue-on-error: true
        run: godot --headless --verbose --export-release "Android" build/nx-penalty-kick-release.apk > build/release-output.log 2>&1

      - name: Check export results
        id: check
        run: |
          if [ -f build/nx-penalty-kick-debug.apk ] && [ -f build/nx-penalty-kick-release.apk ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Write combined error log
        if: steps.check.outputs.success == 'false'
        run: |
          mkdir -p .ci
          {
            echo "----- DEBUG EXPORT LOG -----"
            cat build/debug-output.log 2>/dev/null || echo "(no log)"
            echo ""
            echo "----- RELEASE EXPORT LOG -----"
            cat build/release-output.log 2>/dev/null || echo "(no log)"
          } > .ci/last-error.txt

      - name: Publish error log to repo
        if: steps.check.outputs.success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('.ci/last-error.txt', 'utf8');
            const contentB64 = Buffer.from(content).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.ci/last-error.txt',
                ref: 'main',
              });
              sha = existing.data.sha;
            } catch (e) {
              sha = undefined;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.ci/last-error.txt',
              message: 'Update CI error log [skip ci]',
              content: contentB64,
              branch: 'main',
              sha: sha,
            });

      - name: Upload error log artifact
        if: steps.check.outputs.success == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: error
          path: .ci/last-error.txt

      - name: Fail if export failed
        if: steps.check.outputs.success == 'false'
        run: exit 1

      - name: Upload debug APK
        if: steps.check.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nx-penalty-kick-debug
          path: build/nx-penalty-kick-debug.apk

      - name: Upload release APK
        if: steps.check.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nx-penalty-kick-release
          path: build/nx-penalty-kick-release.apk
