name: Android Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.ci/**'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  export:
    name: Export Android APKs
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register export templates
        continue-on-error: true
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/${GODOT_VERSION}

      - name: Create build directory
        run: mkdir -v -p build

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /root/nx-release.keystore

      - name: Inject release signing config
        run: |
          sed -i "s#__RELEASE_KEYSTORE_PATH__#/root/nx-release.keystore#g" export_presets.cfg
          sed -i "s#__RELEASE_KEY_ALIAS__#${{ secrets.ANDROID_KEY_ALIAS }}#g" export_presets.cfg
          sed -i "s#__RELEASE_KEY_PASSWORD__#${{ secrets.ANDROID_KEY_PASSWORD }}#g" export_presets.cfg

      - name: Export debug APK
        continue-on-error: true
        run: godot --headless --verbose --export-debug "Android" build/nx-penalty-kick-debug.apk > build/debug-output.log 2>&1

      - name: Export release APK
        continue-on-error: true
        run: godot --headless --verbose --export-release "Android" build/nx-penalty-kick-release.apk > build/release-output.log 2>&1

      - name: Check export results
        id: check
        run: |
          if [ -f build/nx-penalty-kick-debug.apk ] && [ -f build/nx-penalty-kick-release.apk ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Write combined error log
        if: steps.check.outputs.success == 'false'
        run: |
          mkdir -p .ci
          {
            echo "----- DEBUG EXPORT LOG -----"
            cat build/debug-output.log 2>/dev/null || echo "(no log)"
            echo ""
            echo "----- RELEASE EXPORT LOG -----"
            cat build/release-output.log 2>/dev/null || echo "(no log)"
          } > .ci/last-error.txt

      - name: Publish error log to repo
        if: steps.check.outputs.success == 'false'
        continue-on-error: true
        run: |
          set +e
          CONTENT_B64=$(base64 -w0 .ci/last-error.txt)
          EXISTING_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/contents/.ci/last-error.txt?ref=main")
          EXISTING_SHA=$(echo "$EXISTING_JSON" | grep -o '"sha": *"[a-f0-9]*"' | head -1 | grep -o '[a-f0-9]\{40\}')
          if [ -z "$EXISTING_SHA" ]; then
            PUT_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/contents/.ci/last-error.txt" \
              -d "{\"message\":\"Update CI error log [skip ci]\",\"content\":\"$CONTENT_B64\",\"branch\":\"main\"}")
          else
            PUT_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/contents/.ci/last-error.txt" \
              -d "{\"message\":\"Update CI error log [skip ci]\",\"content\":\"$CONTENT_B64\",\"sha\":\"$EXISTING_SHA\",\"branch\":\"main\"}")
          fi
          echo "$PUT_RESPONSE" > /tmp/put_response.txt
          DIAG_TEXT=$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e ':a;N;$!ba;s/\n/\\n/g' /tmp/put_response.txt)
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" \
            -d "{\"name\":\"ci-log-publish-diagnostic\",\"head_sha\":\"${{ github.sha }}\",\"status\":\"completed\",\"conclusion\":\"neutral\",\"output\":{\"title\":\"Publish diagnostic\",\"summary\":\"diagnostic\",\"text\":\"$DIAG_TEXT\"}}"

      - name: Upload error log artifact
        if: steps.check.outputs.success == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: error
          path: .ci/last-error.txt

      - name: Fail if export failed
        if: steps.check.outputs.success == 'false'
        run: exit 1

      - name: Upload debug APK
        if: steps.check.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nx-penalty-kick-debug
          path: build/nx-penalty-kick-debug.apk

      - name: Upload release APK
        if: steps.check.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nx-penalty-kick-release
          path: build/nx-penalty-kick-release.apk
